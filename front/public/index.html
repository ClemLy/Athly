<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Athly | Ta progression en salle, en mode jeu</title>
    <meta
      name="description"
      content="Suis tes séances de musculation, gagne de l'XP, débloque des trophées et progresse avec tes amis. Gratuit, installable sur ton téléphone."
    />

    <!-- Couleurs système : barre d'état et interface du navigateur assorties au fond de l'app -->
    <meta name="theme-color" content="#0D1018" />
    <meta name="color-scheme" content="dark" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Athly" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <!-- Aperçu de lien (messageries, réseaux sociaux) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Athly" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Athly | Ta progression en salle, en mode jeu" />
    <meta property="og:description" content="Séances, XP, trophées et défis entre amis. Gratuit, installable sur ton téléphone." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <style id="athly-shell">
      /* ── Base : l'app peint jusqu'aux bords (encoche, barre d'accueil) ─────── */
      html {
        background: #0d1018;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      body {
        margin: 0;
        background: #0d1018;
        color: #fff;
        overscroll-behavior: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        height: 100dvh;
        min-height: 100%;
      }

      /* ── Contrôles : pas de sélection au appui long, pas de délai de tap ───── */
      [role="button"],
      [role="tab"],
      [role="link"],
      [role="checkbox"],
      [role="switch"],
      button {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        touch-action: manipulation;
      }
      /* Retour d'appui immédiat (au toucher, pas au relâchement), façon app native */
      [role="button"],
      [role="link"],
      [role="tab"],
      [role="checkbox"],
      [role="radio"] {
        transition: transform 120ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      [role="button"]:active,
      [role="link"]:active,
      [role="tab"]:active,
      [role="checkbox"]:active,
      [role="radio"]:active {
        transform: scale(0.97);
      }
      [aria-disabled="true"]:active {
        transform: none;
      }
      img {
        -webkit-user-drag: none;
        -webkit-touch-callout: none;
      }

      /* ── Champs : 16 px minimum, sinon Safari iOS zoome la page au focus ─── */
      @media (pointer: coarse) {
        input,
        textarea,
        select {
          font-size: max(16px, 1em) !important;
        }
      }
      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
      }
      input::placeholder,
      textarea::placeholder {
        color: #7e8494;
        opacity: 1;
      }

      /* ── Focus clavier visible et aux couleurs de l'app ────────────────────── */
      :focus {
        outline: none;
      }
      :focus-visible {
        outline: 2px solid #fe7439;
        outline-offset: 2px;
        border-radius: 6px;
      }
      input:focus-visible,
      textarea:focus-visible {
        outline: none;
      }

      /* ── Barres de défilement discrètes (souris) ───────────────────────────── */
      @media (hover: hover) and (pointer: fine) {
        * {
          scrollbar-width: thin;
          scrollbar-color: #2a2a39 transparent;
        }
      }

      /* ── Écran de démarrage, visible le temps que l'app se charge ──────────── */
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #0d1018;
      }
      .boot img {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        animation: boot-in 420ms cubic-bezier(0.23, 1, 0.32, 1) both;
      }
      .boot-bar {
        width: 120px;
        height: 3px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .boot-bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: #fe7439;
        animation: boot-slide 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes boot-in {
        from {
          opacity: 0;
          transform: scale(0.92);
        }
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      .noscript {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        text-align: center;
        font-size: 16px;
        line-height: 1.5;
        background: #0d1018;
        color: #c9ccd4;
      }

      @media (prefers-reduced-motion: reduce) {
        [role]:active {
          transform: none !important;
        }
        *,
        *::before,
        *::after {
          animation-duration: 1ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 1ms !important;
        }
      }
    </style>
  </head>

  <body>
    <noscript>
      <div class="noscript">
        Athly a besoin de JavaScript pour fonctionner. Active-le dans les réglages de ton navigateur puis recharge la page.
      </div>
    </noscript>
    <!-- React remplace le contenu de #root (écran de démarrage) dès que l'app est prête -->
    <div id="root">
      <div class="boot" role="status" aria-label="Chargement d'Athly">
        <img src="/icons/icon-192.png" alt="" />
        <div class="boot-bar"></div>
      </div>
    </div>
    <script src="/register-sw.js" defer></script>
  </body>
</html>
